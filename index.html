<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Фен-стайлер в уникальном дизайне"
    />

    <title>Фен-стайлер — 2 в 1</title>

    <link
      rel="stylesheet"
      href="./styles/index.css"
    />
  </head>

  <body>
    <main class="main-container">
      <section
        id="slide-1"
        class="slide flex-center"
      >
        <div class="slide__content">
          <span class="fen-stayler__ellipse fen-stayler__ellipse--white"></span>
          <span class="fen-stayler__ellipse fen-stayler__ellipse--beige"></span>
          <span
            class="fen-stayler__ellipse fen-stayler__ellipse--orange"
          ></span>

          <header class="slide__header slide__position flex-column-center">
            <h1 class="slide__title slide-head-text">
              ФЕН и СТАЙЛЕР<br />
              в уникальном дизайне
            </h1>

            <span class="slide__badge slide-head-text flex-center shadow"
              >2 в 1</span
            >
          </header>

          <div class="slide__products slide__position flex-justify-center">
            <div class="slide__item flex-column">
              <span class="slide__badge-label slide-head-text shadow">Фен</span>

              <img
                class="slide__image shadow"
                src="./assets/images/fen-stayler-left-side.png"
                alt="Использование фена"
              />
            </div>

            <img
              class="fen-stayler__image--center"
              src="./assets/images/fen-stayler-head.png"
              alt="Девушка с уложенными волосами"
            />

            <div class="slide__item fen-stayler__item-right flex-column">
              <span class="slide__badge-label slide-head-text shadow"
                >Стайлер</span
              >

              <img
                class="slide__image shadow"
                src="./assets/images/fen-stayler-right-side.png"
                alt="Использование стайлера"
              />
            </div>
          </div>
        </div>
      </section>

      <section
        id="slide-2"
        class="slide flex-center"
      >
        <div class="slide__content flex-align-items-center flex-justify-space-around">
          <span class="superlight__ellipse superlight__ellipse--beige"></span>

          <div class="superlight__image--center">
            <div class="superlight__badge-container">
              <svg
                viewBox="0 0 180 179"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M89.507 0L106.011 12.3546L126.113 7.78091L136.165 25.7802L156.39 29.7782L158.252 50.31L175.102 62.1885L168.452 81.7025L179.014 99.4076L165.002 114.53L167.449 135L148.498 143.116L142.408 162.812L121.794 162.517L108.219 178.033L89.507 169.38L70.7949 178.033L57.2202 162.517L36.6063 162.812L30.5161 143.116L11.5647 135L14.0121 114.53L-1.52588e-05 99.4076L10.5618 81.7025L3.91187 62.1885L20.7619 50.31L22.6239 29.7782L42.8486 25.7802L52.9007 7.78091L73.0029 12.3546L89.507 0Z"
                />
              </svg>

              <span class="slide-head-text superlight__badge-label"
                >Не тяжелее чашки кофе</span
              >
            </div>

            <img
              class="superlight__image"
              src="./assets/images/superlight.png"
              alt="Девушка со стайлером и чашкой кофе"
            />
          </div>

          <div class="slide__item superlight-item flex-column-center">
            <h2 class="slide-head-text superlight__title">
              СУПЕР-<br />ЛЁГКИЙ
            </h2>

            <p class="slide__info-text">
              Уменьшает усталость рук<br />при сушке волос, делая процедуру<br />удобной
              и приятной даже после<br />напряжённого рабочего дня.
            </p>

            <span class="slide__badge slide-head-text superlight__badge-head-label">500 г</span>
          </div>
        </div>
      </section>

      <section
        id="slide-3"
        class="slide slide-innovative-motor flex-center"
      >
        <div class="slide-content">
          <!-- Третий слайд -->
        </div>
      </section>
    </main>

    <nav
      class="test-yamaguchi-navigation"
      aria-label="Навигация по слайдам"
    >
      <!-- Боковое колесо -->
    </nav>

    <script
      type="module"
      src="./js/main.js"
    ></script>
  </body>
</html>
